name: Deploy teaching HTML to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build demo outputs
        run: |
          python scripts/01_download_spectrofood.py
          python scripts/02_prepare_spectrofood.py
          python scripts/04_fix_orange_crop_labels.py
          python scripts/05_rename_wavelength_columns.py
          python scripts/03_python_teaching_demo.py

      - name: Assemble static site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp -r docs site/docs
          cp -r orange site/orange
          cp -r outputs site/outputs
          mkdir -p site/data/processed
          cp data/processed/* site/data/processed/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
